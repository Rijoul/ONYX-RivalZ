const { useState, useEffect, useRef, useCallback, useMemo } = React;

const CONSENT_KEY = 'apex_consent_v2';
const CONSENT_VERSION = '2026-05';
// Durée de validité du consentement : 13 mois (recommandation CNIL)
const CONSENT_MAX_AGE_MS = 13 * 30 * 24 * 60 * 60 * 1000;
// How many milliseconds before a user is considered "offline"
const ONLINE_THRESHOLD_MS = 2 * 60 * 1000; // 2 minutes
// How often we update our own presence
const PRESENCE_INTERVAL_MS = 60 * 1000; // 60 seconds

function loadConsent() {
    try {
        const raw = localStorage.getItem(CONSENT_KEY);
        if (!raw) return null;
        const c = JSON.parse(raw);
        if (c.version !== CONSENT_VERSION) return null;
        // ── RGPD : expiration automatique après 13 mois (recommandation CNIL) ──
        if (c.date && (Date.now() - new Date(c.date).getTime()) > CONSENT_MAX_AGE_MS) {
            localStorage.removeItem(CONSENT_KEY);
            return null;
        }
        return c;
    } catch { return null; }
}

function saveConsent(prefs) {
    const c = {
        version: CONSENT_VERSION,
        date: new Date().toISOString(),
        essential: true,
        functional: prefs.functional ?? true,
        analytics: prefs.analytics ?? false,
        ageConfirmed: prefs.ageConfirmed ?? false,
    };
    localStorage.setItem(CONSENT_KEY, JSON.stringify(c));
    return c;
}

function revokeConsent() {
    localStorage.removeItem(CONSENT_KEY);
}

let firebaseLoaded = false;
let auth, db;

function loadFirebase() {
    return new Promise((resolve, reject) => {
        if (firebaseLoaded) { resolve({ auth, db }); return; }
        const scripts = [
            'https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js',
            'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js',
            'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js',
        ];
        let loaded = 0;
        scripts.forEach(src => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = () => { loaded++; if (loaded === scripts.length) initFirebase(resolve, reject); };
            s.onerror = reject;
            document.head.appendChild(s);
        });
    });
}

function initFirebase(resolve, reject) {
    try {
        if (!window.firebase?.apps?.length) {
            window.firebase.initializeApp({
                apiKey: "AIzaSyCkiMirg--YtJMCENWm6Ba4qBn7XY55qrQ",

                storageBucket: "onyx-chat-by-rijoul.firebasestorage.app",
                messagingSenderId: "699855199393",

        }
        auth = window.firebase.auth();
        db = window.firebase.firestore();
        firebaseLoaded = true;
        resolve({ auth, db });

}

// ── PRESENCE HELPERS ─────────────────────────────────────────────────────
function isUserOnline(lastSeenTimestamp) {
    if (!lastSeenTimestamp) return false;
    const lastSeen = lastSeenTimestamp.toDate ? lastSeenTimestamp.toDate() : new Date(lastSeenTimestamp);
    return (Date.now() - lastSeen.getTime()) < ONLINE_THRESHOLD_MS;
}

async function updatePresence(uid) {
    if (!uid || !db) return;
    try {
        await db.collection('artifacts').doc(ONYX_APP_ID)
            .collection('public').doc('data').collection('profiles').doc(uid)
            .update({ lastSeen: window.firebase.firestore.FieldValue.serverTimestamp() });
    } catch(e) { /* silent fail */ }
}

// ── HELPER : vérifie qu'un profil Firestore est valide (non supprimé) ──
// Un profil est considéré valide uniquement s'il existe ET possède un displayName non vide.
function isValidProfile(docData) {
    return docData && typeof docData.displayName === 'string' && docData.displayName.trim() !== '';

        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,

        flag: <><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></>,
        download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,

        userMinus: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="22" y1="11" x2="16" y2="11"/></>,
        refresh: <><path d="M21.5 2v6h-6M2.5 22v-6h6"/><path d="M22 12A10 10 0 0 0 3.2 7.2M2 12a10 10 0 0 0 18.8 4.8"/></>,
        search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
        xCircle: <><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></>,
        info: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>,
    };
    return (
        <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            {paths[name]}
        </svg>
    );
};

    width:'100%',
    background:'rgba(2,6,23,.7)',
    border:'1px solid #1e293b',
    borderRadius:'12px',
    padding:'11px 14px',
    fontSize:'13px',

    fontFamily:'DM Sans,sans-serif',

    color:'white',

// ── ONLINE INDICATOR COMPONENT ────────────────────────────────────────────
const OnlineIndicator = ({ lastSeen, size = 12 }) => {
    const online = isUserOnline(lastSeen);
    return (
        <div style={{
            position:'absolute',
            bottom: size === 12 ? '-3px' : '-4px',
            right: size === 12 ? '-3px' : '-4px',
            width:`${size}px`,
            height:`${size}px`,
            borderRadius:'50%',
            background: online ? '#4ade80' : '#475569',

const OnlineBadge = ({ lastSeen }) => {

    return (
        <div style={{display:'flex',alignItems:'center',gap:'4px',marginTop:'2px'}}>
            <div style={{
                width:'6px',height:'6px',borderRadius:'50%',

                {online ? 'En ligne' : 'Hors ligne'}

// ── FRIENDS TAB ──────────────────────────────────────────────────────────
const FriendsTab = ({ user, friends, setFriends, friendProfiles, setFriendProfiles }) => {
    const [subTab, setSubTab] = useState('friends');
    const [discoverUsers, setDiscoverUsers] = useState([]);
    const [sentRequests, setSentRequests] = useState([]);
    const [incomingRequests, setIncomingRequests] = useState([]);
    const [loadingDiscover, setLoadingDiscover] = useState(false);
    const [removingId, setRemovingId] = useState(null);
    const [actionLoading, setActionLoading] = useState({});

    const friendUids = useMemo(() => friends.map(f => f.uid), [friends]);

    useEffect(() => {
        if (!user) return;
        const unsub = db.collection('apex_friend_requests')
            .where('to', '==', user.uid)
            .where('status', '==', 'pending')
            .onSnapshot(snap => {
                setIncomingRequests(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            });
        return unsub;
    }, [user]);

    useEffect(() => {
        if (!user) return;
        const unsub = db.collection('apex_friend_requests')
            .where('from', '==', user.uid)
            .where('status', '==', 'pending')
            .onSnapshot(snap => {
                setSentRequests(snap.docs.map(d => d.data().to));
            });
        return unsub;
    }, [user]);

    // ── CORRECTION 1 : filtrage des comptes supprimés de Firebase ─────────
    // On ne garde que les documents dont le profil Firestore existe réellement
    // et contient un displayName valide (les comptes supprimés n'ont plus ce champ).
    const loadDiscoverUsers = async () => {
        setLoadingDiscover(true);
        try {
            const snap = await db.collection('artifacts').doc(ONYX_APP_ID)
                .collection('public').doc('data').collection('profiles')
                .limit(50) // Récupérer plus pour compenser les filtrages
                .get();

            const allUsers = snap.docs
                .map(d => ({ uid: d.id, ...d.data() }))
                // ── Filtre 1 : exclure l'utilisateur courant et ses amis déjà ajoutés ──
                .filter(u => u.uid !== user.uid && !friendUids.includes(u.uid))
                // ── Filtre 2 : exclure les profils supprimés / incomplets ──
                // Un compte supprimé dans Firebase Auth laisse souvent un profil Firestore
                // sans displayName ou avec des données vides. On l'exclut.
                .filter(u => isValidProfile(u));

            const shuffled = allUsers.sort(() => Math.random() - 0.5).slice(0, 5);
            setDiscoverUsers(shuffled);
        } catch (e) { console.error(e); }
        setLoadingDiscover(false);
    };

    useEffect(() => {
        if (subTab === 'discover') loadDiscoverUsers();
    }, [subTab]);

    const sendRequest = async (targetUid) => {
        setActionLoading(prev => ({ ...prev, [targetUid]: true }));
        try {
            await db.collection('apex_friend_requests').add({
                from: user.uid,
                to: targetUid,
                status: 'pending',
                createdAt: window.firebase.firestore.FieldValue.serverTimestamp(),
            });
            setSentRequests(prev => [...prev, targetUid]);
        } catch (e) { console.error(e); }
        setActionLoading(prev => ({ ...prev, [targetUid]: false }));
    };

    const acceptRequest = async (req) => {
        setActionLoading(prev => ({ ...prev, [req.id]: true }));
        try {
            const myListRef = db.collection('artifacts').doc(ONYX_APP_ID)
                .collection('users').doc(user.uid).collection('contacts').doc('list');
            const theirListRef = db.collection('artifacts').doc(ONYX_APP_ID)
                .collection('users').doc(req.from).collection('contacts').doc('list');

            const myDoc = await myListRef.get();
            const theirDoc = await theirListRef.get();

            const myFriends = myDoc.exists ? (myDoc.data().friends || []) : [];
            const theirFriends = theirDoc.exists ? (theirDoc.data().friends || []) : [];

            if (!myFriends.find(f => f.uid === req.from)) {
                await myListRef.set({ friends: [...myFriends, { uid: req.from }] });
            }
            if (!theirFriends.find(f => f.uid === user.uid)) {
                await theirListRef.set({ friends: [...theirFriends, { uid: user.uid }] });
            }

            await db.collection('apex_friend_requests').doc(req.id).update({ status: 'accepted' });
        } catch (e) { console.error(e); }
        setActionLoading(prev => ({ ...prev, [req.id]: false }));
    };

    const declineRequest = async (reqId) => {
        setActionLoading(prev => ({ ...prev, [reqId]: true }));
        try {
            await db.collection('apex_friend_requests').doc(reqId).update({ status: 'declined' });
        } catch (e) { console.error(e); }
        setActionLoading(prev => ({ ...prev, [reqId]: false }));
    };

    const removeFriend = async (friendUid) => {
        setRemovingId(friendUid);
        try {
            const myListRef = db.collection('artifacts').doc(ONYX_APP_ID)
                .collection('users').doc(user.uid).collection('contacts').doc('list');
            const theirListRef = db.collection('artifacts').doc(ONYX_APP_ID)
                .collection('users').doc(friendUid).collection('contacts').doc('list');

            const myDoc = await myListRef.get();
            const theirDoc = await theirListRef.get();

            if (myDoc.exists) {
                const updated = (myDoc.data().friends || []).filter(f => f.uid !== friendUid);
                await myListRef.set({ friends: updated });
            }
            if (theirDoc.exists) {
                const updated = (theirDoc.data().friends || []).filter(f => f.uid !== user.uid);
                await theirListRef.set({ friends: updated });
            }
        } catch (e) { console.error(e); }
        setRemovingId(null);
    };

    const pendingCount = incomingRequests.length;

    return (
        <div>
            <div style={{background:'rgba(15,23,42,.9)',border:'1px solid rgba(234,88,12,.2)',borderRadius:'20px',padding:'16px 20px',marginBottom:'16px'}}>
                <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
                    <div style={{width:'44px',height:'44px',borderRadius:'14px',background:'rgba(234,88,12,.12)',border:'1px solid rgba(234,88,12,.25)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <Icon name="users" size={20}/>
                    </div>
                    <div style={{flex:1}}>
                        <h2 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'16px',color:'white',letterSpacing:'.06em'}}>Mes Amis</h2>
                        <p style={{color:'#64748b',fontSize:'11px',marginTop:'2px'}}>{friends.length} contact{friends.length!==1?'s':''} · RivalZ Network</p>
                    </div>
                    {pendingCount > 0 && (
                        <button onClick={() => setSubTab('requests')}
                            style={{display:'flex',alignItems:'center',gap:'6px',padding:'7px 12px',background:'rgba(234,179,8,.1)',border:'1px solid rgba(234,179,8,.3)',borderRadius:'12px',cursor:'pointer',color:'#facc15'}}>
                            <Icon name="bell" size={14}/>
                            <span style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'11px'}}>{pendingCount}</span>
                        </button>
                    )}
                </div>
            </div>

            <div style={{display:'flex',gap:'6px',marginBottom:'16px',overflowX:'auto',paddingBottom:'4px'}}>
                {[
                    { id:'friends', label:'Mes amis', count: friends.length },
                    { id:'requests', label:'Demandes', count: pendingCount },
                    { id:'discover', label:'Découvrir' },
                ].map(t => (
                    <button key={t.id} onClick={() => setSubTab(t.id)}
                        className={`tab-pill ${subTab===t.id?'active':'inactive'}`}
                        style={{display:'flex',alignItems:'center',gap:'5px',flexShrink:0}}>
                        {t.label}
                        {t.count > 0 && (
                            <span style={{width:'16px',height:'16px',borderRadius:'50%',background:t.id==='requests'?'#facc15':'#ea580c',fontSize:'9px',fontWeight:800,color:t.id==='requests'?'#000':'white',display:'flex',alignItems:'center',justifyContent:'center'}}>
                                {t.count}
                            </span>
                        )}
                    </button>
                ))}
            </div>

            {/* ── MY FRIENDS ── */}
            {subTab === 'friends' && (
                <div className="fade-in">
                    {friends.length === 0 ? (
                        <div style={{textAlign:'center',padding:'48px 16px'}}>
                            <div style={{fontSize:'48px',marginBottom:'12px'}} className="emoji-native">👥</div>
                            <h3 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'16px',color:'white',marginBottom:'8px'}}>Aucun ami encore</h3>
                            <p style={{color:'#64748b',fontSize:'12px',marginBottom:'20px',lineHeight:1.6}}>Découvrez des athlètes et lancez-leur un défi !</p>
                            <button onClick={() => setSubTab('discover')}
                                style={{padding:'12px 24px',background:'linear-gradient(135deg,#ea580c,#c2410c)',borderRadius:'14px',color:'white',fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'11px',letterSpacing:'.12em',textTransform:'uppercase',border:'none',cursor:'pointer'}}>
                                Découvrir des athlètes
                            </button>
                        </div>
                    ) : (
                        <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                            <p className="friend-section-title">
                                <Icon name="users" size={12}/>
                                {friends.length} ami{friends.length!==1?'s':''}
                            </p>
                            {friends.map((f, i) => {
                                const fp = friendProfiles[f.uid] || {};
                                const isRemoving = removingId === f.uid;
                                return (
                                    <div key={f.uid} className="friend-card fade-in" style={{animationDelay:`${i*0.04}s`,display:'flex',alignItems:'center',gap:'12px',opacity:isRemoving?.5:1,transition:'opacity .3s'}}>
                                        <div style={{position:'relative'}}>
                                            <img src={fp.photoURL||getAvatar(fp.displayName||'User')}
                                                style={{width:'44px',height:'44px',borderRadius:'12px',objectFit:'cover',border:'1px solid rgba(234,88,12,.2)'}}/>
                                            <OnlineIndicator lastSeen={fp.lastSeen} size={12}/>
                                        </div>
                                        <div style={{flex:1,minWidth:0}}>
                                            <p style={{fontWeight:700,fontSize:'13px',color:'white',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{fp.displayName||'Athlète'}</p>
                                            <OnlineBadge lastSeen={fp.lastSeen}/>
                                        </div>
                                        <button
                                            className="delete-btn"
                                            disabled={isRemoving}
                                            onClick={() => removeFriend(f.uid)}
                                            title="Supprimer cet ami">
                                            {isRemoving
                                                ? <div style={{width:'12px',height:'12px',border:'2px solid rgba(248,113,113,.3)',borderTopColor:'#f87171',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>
                                                : <Icon name="userMinus" size={14}/>
                                            }
                                        </button>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            )}

            {/* ── FRIEND REQUESTS ── */}
            {subTab === 'requests' && (
                <div className="fade-in">
                    {incomingRequests.length === 0 ? (
                        <div style={{textAlign:'center',padding:'48px 16px'}}>
                            <div style={{fontSize:'48px',marginBottom:'12px'}} className="emoji-native">📬</div>
                            <h3 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'16px',color:'white',marginBottom:'8px'}}>Aucune demande</h3>
                            <p style={{color:'#64748b',fontSize:'12px',lineHeight:1.6}}>Vous n'avez pas de demande d'ami en attente.</p>
                        </div>
                    ) : (
                        <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                            <p className="friend-section-title">
                                <Icon name="bell" size={12}/>
                                {incomingRequests.length} demande{incomingRequests.length!==1?'s':''} reçue{incomingRequests.length!==1?'s':''}
                            </p>
                            {incomingRequests.map((req, i) => {
                                const fp = friendProfiles[req.from] || {};
                                const isLoading = actionLoading[req.id];
                                return (
                                    <RequestCard key={req.id} req={req} fp={fp} isLoading={isLoading}
                                        onAccept={() => acceptRequest(req)}
                                        onDecline={() => declineRequest(req.id)}
                                        animDelay={i*0.05}/>
                                );
                            })}
                        </div>
                    )}
                </div>
            )}

            {/* ── DISCOVER ── */}
            {subTab === 'discover' && (
                <div className="fade-in">
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
                        <p className="friend-section-title" style={{marginBottom:0}}>
                            <Icon name="search" size={12}/>
                            Athlètes à défier
                        </p>
                        <button onClick={loadDiscoverUsers} disabled={loadingDiscover}
                            style={{display:'flex',alignItems:'center',gap:'5px',padding:'6px 12px',background:'rgba(30,41,59,.8)',border:'1px solid rgba(30,41,59,.8)',borderRadius:'10px',cursor:'pointer',color:'#64748b',fontSize:'10px',fontWeight:700}}>
                            <div style={{animation:loadingDiscover?'spin .7s linear infinite':'none',display:'flex'}}>
                                <Icon name="refresh" size={12}/>
                            </div>
                            Actualiser
                        </button>
                    </div>

                    {loadingDiscover ? (
                        <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                            {[1,2,3,4,5].map(i => (
                                <div key={i} style={{height:'72px',background:'rgba(15,23,42,.6)',border:'1px solid rgba(30,41,59,.6)',borderRadius:'16px',animation:'pulse 1.5s ease-in-out infinite',animationDelay:`${i*0.1}s`}}/>
                            ))}
                        </div>
                    ) : discoverUsers.length === 0 ? (
                        <div style={{textAlign:'center',padding:'48px 16px'}}>
                            <div style={{fontSize:'48px',marginBottom:'12px'}} className="emoji-native">🔍</div>
                            <p style={{color:'#64748b',fontSize:'12px'}}>Aucun nouvel athlète à découvrir pour l'instant.</p>
                        </div>
                    ) : (
                        <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                            {discoverUsers.map((u, i) => {
                                const alreadySent = sentRequests.includes(u.uid);
                                const isAlreadyFriend = friendUids.includes(u.uid);
                                const isLoading = actionLoading[u.uid];
                                return (
                                    <div key={u.uid} className="discover-card fade-in" style={{animationDelay:`${i*0.07}s`,display:'flex',alignItems:'center',gap:'12px'}}>
                                        <div style={{position:'relative',flexShrink:0}}>
                                            <img src={u.photoURL||getAvatar(u.displayName||'User')}
                                                style={{width:'44px',height:'44px',borderRadius:'12px',objectFit:'cover',border:'1px solid rgba(30,41,59,.8)'}}/>
                                            <OnlineIndicator lastSeen={u.lastSeen} size={12}/>
                                        </div>
                                        <div style={{flex:1,minWidth:0}}>
                                            <p style={{fontWeight:700,fontSize:'13px',color:'white',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.displayName||'Athlète'}</p>
                                            <OnlineBadge lastSeen={u.lastSeen}/>
                                        </div>
                                        {isAlreadyFriend ? (
                                            <span className="badge badge-green" style={{fontSize:'9px'}}>
                                                <Icon name="check" size={8}/>Ami
                                            </span>
                                        ) : (
                                            <button
                                                className={`add-btn ${alreadySent?'sent':''}`}
                                                disabled={alreadySent||isLoading}
                                                onClick={() => !alreadySent && sendRequest(u.uid)}>
                                                {isLoading ? (
                                                    <div style={{width:'12px',height:'12px',border:'2px solid rgba(96,165,250,.3)',borderTopColor:'#60a5fa',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>
                                                ) : alreadySent ? (
                                                    '✓ Envoyé'
                                                ) : (
                                                    <span style={{display:'flex',alignItems:'center',gap:'4px'}}>
                                                        <Icon name="userPlus" size={11}/>Ajouter
                                                    </span>
                                                )}
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                            <div style={{marginTop:'8px',padding:'12px',background:'rgba(2,6,23,.5)',border:'1px solid rgba(30,41,59,.6)',borderRadius:'14px',textAlign:'center'}}>
                                <p style={{color:'#475569',fontSize:'10px',lineHeight:1.6}}>
                                    Seuls les comptes actifs sont affichés.<br/>
                                    Actualisez pour découvrir d'autres athlètes.
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            )}
        </div>
    );
};

const RequestCard = ({ req, fp: initialFp, isLoading, onAccept, onDecline, animDelay }) => {
    const [fp, setFp] = useState(initialFp);

    useEffect(() => {
        if (!fp?.displayName && req.from) {
            db.collection('artifacts').doc(ONYX_APP_ID)
                .collection('public').doc('data').collection('profiles').doc(req.from)

const formatDate = (ts) => {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
};
const daysLeft = (deadline) => {
    if (!deadline) return null;
    const d = deadline.toDate ? deadline.toDate() : new Date(deadline);
    return Math.ceil((d - new Date()) / 86400000);
};
const progressPct = (current, goal) => Math.min(100, Math.round((current / goal) * 100));

        setLoading(true);
        const newVal = Number(value);
        const otherUid = challenge.createdBy===user.uid ? challenge.challengedUid : challenge.createdBy;
        const otherProgress = challenge.progress?.[otherUid] || 0;
        const updates = { [`progress.${user.uid}`]: newVal };
        if (newVal >= challenge.goal) { updates.status='completed'; updates.winner=user.uid; }
        else if (otherProgress >= challenge.goal) { updates.status='completed'; updates.winner=otherUid; }
        else { updates.status='active'; }
        await db.collection(APEX_APP_ID).doc(challenge.id).update(updates);
        setLoading(false); onClose();
    };

    const pct = Math.min(100, Math.round((value/challenge.goal)*100));

    return (
        <div className="modal-overlay" onClick={onClose}>
            <div className="modal-sheet" style={{padding:'24px',borderRadius:'28px'}} onClick={e=>e.stopPropagation()}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'20px'}}>
                    <div>
                        <p style={{color:'#ea580c',fontSize:'9px',fontWeight:700,letterSpacing:'.15em',textTransform:'uppercase'}}>Mise à jour</p>
                        <h3 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'16px',color:'white',marginTop:'2px'}}>{challenge.title}</h3>
                    </div>
                    <button onClick={onClose} style={{padding:'8px',background:'rgba(30,41,59,.8)',borderRadius:'12px',border:'1px solid #1e293b',color:'#64748b',cursor:'pointer',display:'flex'}}><Icon name="x" size={16}/></button>
                </div>
                <div style={{textAlign:'center',marginBottom:'24px'}}>
                    <div style={{fontSize:'40px',marginBottom:'4px'}} className="emoji-native">{SPORT_ICONS[challenge.sport]}</div>
                    <div style={{display:'flex',alignItems:'baseline',justifyContent:'center',gap:'6px'}}>
                        <input type="number" min="0" max={challenge.goal*2}
                            style={{background:'transparent',border:'none',fontSize:'48px',fontFamily:'Syne,sans-serif',fontWeight:800,color:'#f97316',textAlign:'center',width:'160px'}}
                            value={value} onChange={e=>setValue(e.target.value)}/>
                        <span style={{color:'#64748b',fontSize:'14px',fontWeight:600}}>/{challenge.goal} {challenge.unit}</span>
                    </div>
                    <div className="progress-bar" style={{marginTop:'12px'}}>
                        <div className="progress-fill" style={{'--prog-w':pct+'%'}}/>
                    </div>
                    <p style={{color:'#64748b',fontSize:'11px',marginTop:'6px'}}>{pct}% accompli</p>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px',marginBottom:'20px'}}>
                    {[25,50,75,100].map(p => {
                        const v = Math.round((challenge.goal*p)/100);
                        return (
                            <button key={p} onClick={()=>setValue(v)} style={{padding:'10px 4px',borderRadius:'12px',border:'1px solid #1e293b',background:'rgba(15,23,42,.8)',cursor:'pointer',textAlign:'center'}}>
                                <p style={{color:'#f97316',fontSize:'12px',fontWeight:800,fontFamily:'Syne,sans-serif'}}>{p}%</p>
                                <p style={{color:'#64748b',fontSize:'9px',marginTop:'2px'}}>{v} {challenge.unit}</p>
                            </button>
                        );
                    })}
                </div>
                <button disabled={loading} onClick={handleUpdate}
                    style={{width:'100%',padding:'14px',borderRadius:'14px',background:'linear-gradient(135deg,#ea580c,#c2410c)',color:'white',fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'11px',letterSpacing:'.12em',textTransform:'uppercase',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}}>
                    {loading ? <><div style={{width:'14px',height:'14px',border:'2px solid rgba(255,255,255,.3)',borderTopColor:'white',borderRadius:'50%',animation:'spin .7s linear infinite'}}/> Sauvegarde...</> : '✓ Enregistrer ma progression'}
                </button>
            </div>
        </div>
    );
};

const ChallengeCard = ({ challenge, user, onUpdate, onAccept, onDecline, onCancel }) => {
    const isCreator = challenge.createdBy === user.uid;
    const otherName = isCreator ? challenge.challengedName : challenge.createdByName;
    const otherPhoto = isCreator ? challenge.challengedPhoto : challenge.createdByPhoto;
    const otherUid = isCreator ? challenge.challengedUid : challenge.createdBy;
    const myProg = challenge.progress?.[user.uid] || 0;
    const otherProg = challenge.progress?.[otherUid] || 0;
    const myPct = progressPct(myProg, challenge.goal);
    const otherPct = progressPct(otherProg, challenge.goal);
    const dl = daysLeft(challenge.deadline);
    const isWon = challenge.status==='completed' && challenge.winner===user.uid;
    const isLost = challenge.status==='completed' && challenge.winner===otherUid;
    const isPending = challenge.status==='pending';
    const isActive = challenge.status==='active';
    const [cancelling, setCancelling] = useState(false);

    const handleCancel = async () => {
        setCancelling(true);
        try { await onCancel(challenge.id); } finally { setCancelling(false); }
    };

    return (
        <div className={`challenge-card ${isWon?'won':''} ${isLost?'lost':''} ${isCreator&&!isWon&&!isLost?'mine':''}`} style={{padding:'16px',marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'14px'}}>
                <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                    <div style={{width:'36px',height:'36px',borderRadius:'10px',background:'rgba(234,88,12,.15)',border:'1px solid rgba(234,88,12,.25)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px'}} className="emoji-native">
                        {SPORT_ICONS[challenge.sport]||'🎯'}
                    </div>
                    <div>
                        <h4 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'13px',color:'white',lineHeight:1.2}}>{challenge.title}</h4>
                        <p style={{fontSize:'10px',color:'#64748b',marginTop:'2px'}}>{isCreator?'Vous avez défié':'Défié par'} <strong style={{color:'#94a3b8'}}>{otherName}</strong></p>
                    </div>
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'4px'}}>
                    {isWon && <span className="badge badge-green"><Icon name="trophy" size={9}/>Victoire</span>}
                    {isLost && <span className="badge badge-red">Défaite</span>}
                    {isPending&&!isCreator && <span className="badge badge-yellow">En attente</span>}
                    {isPending&&isCreator && <span className="badge badge-slate">Envoyé</span>}
                    {isActive && <span className="badge badge-orange"><Icon name="flame" size={9}/>En cours</span>}
                    {dl!==null&&isActive && <span style={{fontSize:'9px',color:dl<=2?'#f87171':'#64748b',fontWeight:700}}>J-{dl}</span>}
                </div>
            </div>
            <div style={{background:'rgba(2,6,23,.5)',borderRadius:'12px',padding:'10px 12px',marginBottom:'12px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{color:'#64748b',fontSize:'10px',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>Objectif</span>
                <span style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'16px',color:'#f97316'}}>{challenge.goal} <span style={{fontSize:'11px',color:'#ea580c'}}>{challenge.unit}</span></span>
            </div>
            {(isActive||isWon||isLost) && (
                <div style={{marginBottom:'12px'}}>
                    {[{uid:user.uid,photo:user.photoURL,name:'Moi',prog:myProg,pct:myPct,color:'#f97316',trackColor:'linear-gradient(90deg,#ea580c,#f97316)'},
                      {uid:otherUid,photo:otherPhoto,name:otherName,prog:otherProg,pct:otherPct,color:'#64748b',trackColor:'linear-gradient(90deg,#475569,#64748b)'}].map(p => (
                        <div key={p.uid} style={{marginBottom:'8px'}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'5px'}}>
                                <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                                    <img src={p.photo||getAvatar(p.name)} style={{width:'20px',height:'20px',borderRadius:'6px',objectFit:'cover'}}/>
                                    <span style={{fontSize:'10px',fontWeight:700,color:'#e2e8f0'}}>{p.name}</span>
                                </div>
                                <span style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'12px',color:p.color}}>{p.prog}/{challenge.goal} {challenge.unit}</span>
                            </div>
                            <div className="progress-bar">
                                <div style={{height:'100%',borderRadius:'3px',background:p.trackColor,width:p.pct+'%',transition:'width 1s cubic-bezier(.16,1,.3,1)'}}/>
                            </div>
                        </div>
                    ))}
                </div>
            )}
            {isPending&&!isCreator && (
                <div style={{display:'flex',gap:'8px'}}>
                    <button onClick={()=>onDecline(challenge.id)} style={{flex:1,padding:'10px',borderRadius:'12px',background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.2)',color:'#f87171',fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:'10px',letterSpacing:'.1em',textTransform:'uppercase',cursor:'pointer'}}>Refuser</button>

            )}
            {isActive && (
                <button onClick={()=>onUpdate(challenge)}
                    style={{width:'100%',padding:'10px',borderRadius:'12px',background:'rgba(234,88,12,.1)',border:'1px solid rgba(234,88,12,.25)',color:'#f97316',fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:'10px',letterSpacing:'.1em',textTransform:'uppercase',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'6px'}}>
                    <Icon name="edit" size={12}/>Mettre à jour ma progression
                </button>
            )}
            {(isWon||isLost) && (
                <div style={{textAlign:'center',padding:'8px',background:isWon?'rgba(34,197,94,.06)':'rgba(239,68,68,.06)',borderRadius:'12px',border:`1px solid ${isWon?'rgba(34,197,94,.2)':'rgba(239,68,68,.15)'}`}}>
                    <span style={{fontSize:'18px'}} className="emoji-native">{isWon?'🏆':'💪'}</span>
                    <p style={{fontSize:'10px',color:isWon?'#4ade80':'#f87171',fontWeight:700,marginTop:'2px'}}>{isWon?'Félicitations ! Défi remporté !':'Bon courage pour la prochaine !'}</p>
                </div>
            )}
        </div>
    );
};

const LeaderboardTab = ({ user, friends, friendProfiles, challenges }) => {
    const scores = useMemo(() => {
        const map = {};
        const allUids = [user.uid, ...friends.map(f=>f.uid)];
        allUids.forEach(uid => { map[uid] = {wins:0,total:0,pts:0}; });
        challenges.forEach(c => {
            if (c.status==='completed'&&c.winner) {
                allUids.forEach(uid => {
                    if (c.createdBy===uid||c.challengedUid===uid) {
                        map[uid]=map[uid]||{wins:0,total:0,pts:0};
                        map[uid].total++;
                        if (c.winner===uid){map[uid].wins++;map[uid].pts+=100;}
                        else map[uid].pts+=10;
                    }
                });
            }
        });
        return Object.entries(map).map(([uid,s]) => {
            const isMe=uid===user.uid;
            const p=isMe?{displayName:'Moi',photoURL:user.photoURL||getAvatar('Moi'),lastSeen:user.lastSeen}:(friendProfiles[uid]||{});
            return {uid,...s,displayName:p.displayName||'Joueur',photoURL:p.photoURL||getAvatar(p.displayName),lastSeen:p.lastSeen};
        }).sort((a,b)=>b.pts-a.pts||b.wins-a.wins);
    },[challenges,friends,friendProfiles,user]);

    return (
        <div>
            <div style={{background:'rgba(234,88,12,.08)',border:'1px solid rgba(234,88,12,.2)',borderRadius:'20px',padding:'20px',marginBottom:'16px',textAlign:'center'}}>
                <div style={{fontSize:'36px',marginBottom:'8px'}} className="emoji-native">🏆</div>

                <p style={{color:'#64748b',fontSize:'11px',marginTop:'4px'}}>Basé sur les défis complétés</p>
            </div>
            {scores.length===0 ? (
                <div style={{textAlign:'center',padding:'32px',color:'#64748b'}}>Aucun défi complété encore.</div>
            ) : (
                <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                    {scores.map((s,i) => (
                        <div key={s.uid} className="fade-in" style={{background:'rgba(15,23,42,.9)',border:`1px solid ${s.uid===user.uid?'rgba(234,88,12,.3)':'rgba(30,41,59,.8)'}`,borderRadius:'16px',padding:'14px 16px',display:'flex',alignItems:'center',gap:'12px',animationDelay:`${i*0.05}s`}}>
                            <div style={{width:'28px',textAlign:'center',fontSize:'20px'}} className="emoji-native">
                                {['🥇','🥈','🥉'][i] || <span style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'14px',color:'#475569'}}>#{i+1}</span>}
                            </div>
                            <div style={{position:'relative'}}>
                                <img src={s.photoURL} style={{width:'36px',height:'36px',borderRadius:'10px',objectFit:'cover'}}/>
                                <OnlineIndicator lastSeen={s.lastSeen} size={10}/>
                            </div>
                            <div style={{flex:1}}>
                                <p style={{fontWeight:700,fontSize:'13px',color:s.uid===user.uid?'#f97316':'white'}}>{s.displayName}</p>
                                <p style={{fontSize:'10px',color:'#64748b'}}>{s.wins} victoire{s.wins!==1?'s':''} · {s.total} défi{s.total!==1?'s':''}</p>
                            </div>
                            <div style={{textAlign:'right'}}>
                                <p style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'18px',color:'#f97316'}}>{s.pts}</p>
                                <p style={{fontSize:'9px',color:'#64748b',textTransform:'uppercase',letterSpacing:'.08em'}}>pts</p>

                    ))}

};

    const [friendProfiles, setFriendProfiles] = useState({});
    const [showCreate, setShowCreate] = useState(false);
    const [updateTarget, setUpdateTarget] = useState(null);
    const [filter, setFilter] = useState('all');
    const [friendRequestCount, setFriendRequestCount] = useState(0);
    const presenceIntervalRef = useRef(null);

    useEffect(() => {
        if (!ageConfirmed) { setShowAgeGate(true); setLoading(false); return; }
        if (!consentState) { setShowConsentBanner(true); setLoading(false); return; }
        loadFirebase().then(() => setFirebaseReady(true)).catch(() => setLoading(false));
    }, [ageConfirmed, consentState]);

    useEffect(() => {
        if (!firebaseReady) return;
        const unsub = auth.onAuthStateChanged(async (u) => {
            if (u) {
                setUser(u);
                const ref = db.collection('artifacts').doc(ONYX_APP_ID)
                    .collection('public').doc('data').collection('profiles').doc(u.uid);
                ref.onSnapshot(doc => {
                    if (doc.exists) setProfile(doc.data());
                    else {
                        const np = {uid:u.uid,displayName:u.email.split('@')[0],photoURL:getAvatar(u.email.split('@')[0]),createdAt:window.firebase.firestore.FieldValue.serverTimestamp()};
                        ref.set(np); setProfile(np);
                    }
                });
            } else {
                setUser(null);
                if (presenceIntervalRef.current) {
                    clearInterval(presenceIntervalRef.current);
                    presenceIntervalRef.current = null;
                }
            }
            setLoading(false);
        });
        return unsub;
    }, [firebaseReady]);

    useEffect(() => {
        if (!user || !firebaseReady) return;
        updatePresence(user.uid);
        presenceIntervalRef.current = setInterval(() => {
            updatePresence(user.uid);
        }, PRESENCE_INTERVAL_MS);
        const handleVisibility = () => {
            if (!document.hidden) updatePresence(user.uid);
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => {
            clearInterval(presenceIntervalRef.current);
            presenceIntervalRef.current = null;
            document.removeEventListener('visibilitychange', handleVisibility);
        };
    }, [user, firebaseReady]);

    useEffect(() => {
        if (!user||!firebaseReady) return;
        const unsub = db.collection('artifacts').doc(ONYX_APP_ID).collection('users').doc(user.uid).collection('contacts').doc('list')
            .onSnapshot(doc => { if (doc.exists) setFriends(doc.data().friends||[]); else setFriends([]); });
        return unsub;
    },[user,firebaseReady]);

    useEffect(() => {
        if (!user||friends.length===0||!firebaseReady) return;
        const unsubs = friends.map(f =>
            db.collection('artifacts').doc(ONYX_APP_ID).collection('public').doc('data').collection('profiles').doc(f.uid)
                .onSnapshot(doc => { if (doc.exists) setFriendProfiles(p=>({...p,[f.uid]:doc.data()})); })
        );
        setLoading(false);
        return () => unsubs.forEach(u=>u());
    },[friends,user,firebaseReady]);

    useEffect(() => {
        if (!user||!firebaseReady) return;
        const unsub = db.collection('apex_friend_requests')
            .where('to', '==', user.uid)
            .where('status', '==', 'pending')
            .onSnapshot(snap => setFriendRequestCount(snap.size));
        return unsub;
    },[user,firebaseReady]);

    useEffect(() => {
        if (!user||!firebaseReady) return;
        const unsub = db.collection(APEX_APP_ID).where('createdBy','==',user.uid)
            .onSnapshot(snap => {
                const mine = snap.docs.map(d=>({id:d.id,...d.data()}));
                setChallenges(prev => {
                    const others=prev.filter(c=>c.createdBy!==user.uid);
                    return [...mine,...others].sort((a,b)=>(b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0));
                });
            });
        const unsub2 = db.collection(APEX_APP_ID).where('challengedUid','==',user.uid)
            .onSnapshot(snap => {
                const theirs = snap.docs.map(d=>({id:d.id,...d.data()}));
                setChallenges(prev => {
                    const mine=prev.filter(c=>c.challengedUid!==user.uid);
                    return [...mine,...theirs].sort((a,b)=>(b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0));
                });
            });
        setLoading(false);
        return ()=>{ unsub(); unsub2(); };
    },[user,firebaseReady]);

    const handleAgeConfirm = () => { setAgeConfirmed(true); setShowAgeGate(false); setShowConsentBanner(true); };
    const handleAgeDeny = () => { setShowAgeGate(false); setLoading(false); };
    const handleAcceptAll = () => { const c = saveConsent({functional:true,analytics:true,ageConfirmed:true}); setConsentState(c); setShowConsentBanner(false); };
    const handleRefuseAll = () => { const c = saveConsent({functional:false,analytics:false,ageConfirmed:true}); setConsentState(c); setShowConsentBanner(false); };
    const handleCustomSave = (prefs) => { const c = saveConsent({...prefs,ageConfirmed:true}); setConsentState(c); setShowConsentBanner(false); setShowCustomizer(false); };
    const handleManageConsent = () => setShowConsentBanner(true);

    const acceptChallenge = async (id) => { await db.collection(APEX_APP_ID).doc(id).update({status:'active',accepted:true}); };
    const declineChallenge = async (id) => { await db.collection(APEX_APP_ID).doc(id).update({status:'declined'}); };
    const cancelChallenge = async (id) => { await db.collection(APEX_APP_ID).doc(id).update({status:'cancelled'}); };

    const filteredChallenges = useMemo(() => {
        if (filter==='all') return challenges.filter(c=>c.status!=='declined'&&c.status!=='cancelled');
        return challenges.filter(c=>c.status===filter);
    },[challenges,filter]);

    const pendingCount = challenges.filter(c=>c.status==='pending'&&c.challengedUid===user?.uid).length;
    const activeCount = challenges.filter(c=>c.status==='active').length;

    if (showPrivacy) return <PrivacyPage onClose={()=>setShowPrivacy(false)}/>;
    if (showTerms) return <TermsPage onClose={()=>setShowTerms(false)}/>;
    if (showAgeGate) return <AgeGate onConfirm={handleAgeConfirm} onDeny={handleAgeDeny}/>;

    if (!ageConfirmed && !showAgeGate) return (
        <div style={{height:'100dvh',background:'#020617',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px',textAlign:'center'}}>
            <div className="fade-in">
                <div style={{fontSize:'48px',marginBottom:'16px'}} className="emoji-native">🔒</div>
                <h2 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'18px',color:'white',marginBottom:'8px'}}>Accès non autorisé</h2>
                <p style={{color:'#64748b',fontSize:'12px',lineHeight:1.7,maxWidth:'280px'}}>ONYX RivalZ est réservé aux personnes âgées de 16 ans ou plus.</p>
                <button onClick={()=>setShowAgeGate(true)} style={{marginTop:'20px',padding:'12px 24px',background:'rgba(30,41,59,.8)',border:'1px solid #1e293b',borderRadius:'12px',color:'#94a3b8',fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:'10px',letterSpacing:'.1em',textTransform:'uppercase',cursor:'pointer'}}>
                    J'ai en réalité 16 ans ou plus
                </button>
            </div>
        </div>
    );

    if (loading && consentState && !firebaseReady) return (
        <div style={{height:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',background:'#020617',flexDirection:'column',gap:'16px'}}>
            <div style={{width:'40px',height:'40px',border:'3px solid rgba(234,88,12,.3)',borderTopColor:'#f97316',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
            <p style={{color:'#64748b',fontSize:'11px',fontFamily:'Syne,sans-serif',fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase'}}>Initialisation sécurisée…</p>
        </div>
    );

    return (
        <>
            {showConsentBanner && !showCustomizer && (
                <ConsentBanner onAccept={handleAcceptAll} onRefuse={handleRefuseAll} onCustomize={()=>setShowCustomizer(true)} onPrivacy={()=>setShowPrivacy(true)} onTerms={()=>setShowTerms(true)}/>
            )}
            {showCustomizer && (
                <ConsentCustomizer onSave={handleCustomSave} onClose={()=>setShowCustomizer(false)}/>
            )}
            {showRights && user && (
                <RightsModal user={user} onClose={()=>setShowRights(false)} onDeleteAccount={()=>{ auth.signOut(); revokeConsent(); window.location.reload(); }}/>
            )}

            {consentState && !showConsentBanner && (
                <div style={{height:'100dvh',display:'flex',flexDirection:'column',overflow:'hidden',background:'#020617',paddingBottom:'env(safe-area-inset-bottom)'}}>
                    {!user && firebaseReady && (
                        <AuthScreen onShowPrivacy={()=>setShowPrivacy(true)} onShowTerms={()=>setShowTerms(true)}/>
                    )}

                    {user && firebaseReady && (
                        <>
                            <header style={{flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',paddingTop:'calc(12px + env(safe-area-inset-top))',borderBottom:'1px solid #0f172a',background:'rgba(2,6,23,.95)',backdropFilter:'blur(16px)'}}>
                                <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                                    <div style={{width:'34px',height:'34px',background:'#0f172a',borderRadius:'10px',border:'1px solid rgba(234,88,12,.35)',overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'}}>
                                        <LOGO/>
                                    </div>
                                    <div>
                                        <h1 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'14px',letterSpacing:'.1em',textTransform:'uppercase',color:'white',lineHeight:1}}>ONYX RivalZ</h1>
                                        <p style={{fontSize:'8px',color:'#ea580c',fontWeight:700,letterSpacing:'.18em',textTransform:'uppercase'}}>Défis Sportifs</p>
                                    </div>
                                </div>
                                <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                                    {pendingCount>0 && (
                                        <button onClick={()=>{setTab('home');setFilter('pending');}} style={{position:'relative',padding:'8px',background:'rgba(234,179,8,.1)',borderRadius:'10px',border:'1px solid rgba(234,179,8,.25)',cursor:'pointer',color:'#facc15',display:'flex'}}>
                                            <Icon name="bell" size={16}/>
                                            <span style={{position:'absolute',top:'-4px',right:'-4px',width:'16px',height:'16px',background:'#f97316',borderRadius:'50%',fontSize:'9px',fontWeight:800,color:'white',display:'flex',alignItems:'center',justifyContent:'center'}}>{pendingCount}</span>
                                        </button>
                                    )}
                                    <button onClick={()=>setShowCreate(true)}
                                        style={{display:'flex',alignItems:'center',gap:'6px',padding:'8px 14px',background:'linear-gradient(135deg,#ea580c,#c2410c)',borderRadius:'12px',border:'none',cursor:'pointer',boxShadow:'0 4px 12px rgba(234,88,12,.3)'}}>
                                        <Icon name="plus" size={14}/>
                                        <span style={{fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:'10px',color:'white',letterSpacing:'.1em',textTransform:'uppercase'}}>Défi</span>
                                    </button>
                                </div>
                            </header>

                            <div className="scroll-area custom-scroll" style={{flex:1,overflow:'hidden auto',padding:'16px 16px 8px'}}>
                                {tab==='home' && (
                                    <div className="fade-in">
                                        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'16px'}}>
                                            {[
                                                {label:'Actifs',value:activeCount,color:'#f97316'},
                                                {label:'Victoires',value:challenges.filter(c=>c.status==='completed'&&c.winner===user.uid).length,color:'#facc15'},
                                                {label:'Total',value:challenges.filter(c=>c.status!=='declined'&&c.status!=='cancelled').length,color:'#60a5fa'},
                                            ].map(s => (
                                                <div key={s.label} style={{background:'rgba(15,23,42,.9)',border:'1px solid rgba(30,41,59,.8)',borderRadius:'14px',padding:'12px',textAlign:'center'}}>
                                                    <p style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'22px',color:s.color}}>{s.value}</p>
                                                    <p style={{fontSize:'9px',color:'#64748b',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginTop:'2px'}}>{s.label}</p>
                                                </div>
                                            ))}
                                        </div>
                                        <div style={{display:'flex',gap:'6px',marginBottom:'16px',overflowX:'auto',paddingBottom:'4px'}}>
                                            {[{id:'all',label:'Tous'},{id:'pending',label:'En attente',count:challenges.filter(c=>c.status==='pending').length},{id:'active',label:'En cours'},{id:'completed',label:'Terminés'}].map(f => (
                                                <button key={f.id} onClick={()=>setFilter(f.id)}
                                                    style={{flexShrink:0,display:'flex',alignItems:'center',gap:'5px',padding:'7px 14px',borderRadius:'99px',border:`1px solid ${filter===f.id?'rgba(234,88,12,.5)':'rgba(30,41,59,.8)'}`,background:filter===f.id?'rgba(234,88,12,.1)':'rgba(15,23,42,.8)',cursor:'pointer',whiteSpace:'nowrap'}}>
                                                    <span style={{fontSize:'10px',fontWeight:700,color:filter===f.id?'#f97316':'#64748b',letterSpacing:'.06em'}}>{f.label}</span>
                                                    {f.count>0&&<span style={{width:'16px',height:'16px',borderRadius:'50%',background:'#ea580c',fontSize:'9px',fontWeight:800,color:'white',display:'flex',alignItems:'center',justifyContent:'center'}}>{f.count}</span>}
                                                </button>
                                            ))}
                                        </div>
                                        {filteredChallenges.length===0 ? (
                                            <div style={{textAlign:'center',padding:'48px 16px'}}>
                                                <div style={{fontSize:'48px',marginBottom:'12px'}} className="emoji-native">⚡</div>
                                                <h3 style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'16px',color:'white',marginBottom:'8px'}}>Aucun défi ici</h3>
                                                <p style={{color:'#64748b',fontSize:'12px',marginBottom:'20px'}}>Lancez votre premier défi à un ami !</p>
                                                <button onClick={()=>setShowCreate(true)}
                                                    style={{padding:'12px 24px',background:'linear-gradient(135deg,#ea580c,#c2410c)',borderRadius:'14px',color:'white',fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:'11px',letterSpacing:'.12em',textTransform:'uppercase',border:'none',cursor:'pointer'}}>
                                                    + Créer un défi
                                                </button>
                                            </div>
                                        ) : (
                                            filteredChallenges.map(c => (
                                                <ChallengeCard key={c.id} challenge={c}
                                                    user={{uid:user.uid,photoURL:profile.photoURL,displayName:profile.displayName}}
                                                    onUpdate={setUpdateTarget} onAccept={acceptChallenge} onDecline={declineChallenge} onCancel={cancelChallenge}/>
                                            ))
                                        )}
                                    </div>
                                )}
                                {tab==='friends' && (
                                    <div className="fade-in">
                                        <FriendsTab
                                            user={user}
                                            friends={friends}
                                            setFriends={setFriends}
                                            friendProfiles={friendProfiles}
                                            setFriendProfiles={setFriendProfiles}
                                        />
                                    </div>
                                )}
                                {tab==='leaderboard' && (
                                    <div className="fade-in">
                                        <LeaderboardTab user={{uid:user.uid,...profile}} friends={friends} friendProfiles={friendProfiles} challenges={challenges}/>
                                    </div>
                                )}
                                {tab==='profile' && (
                                    <div className="fade-in">
                                        <ProfileTab
                                            user={user} profile={profile} setProfile={setProfile} challenges={challenges}
                                            onShowRights={()=>setShowRights(true)}
                                            onShowPrivacy={()=>setShowPrivacy(true)}
                                            onShowTerms={()=>setShowTerms(true)}
                                            onManageConsent={handleManageConsent}
                                        />
                                    </div>
                                )}
                            </div>

                            <nav style={{flexShrink:0,borderTop:'1px solid #0f172a',background:'rgba(2,6,23,.98)',display:'flex',justifyContent:'space-around',padding:'6px 4px',paddingBottom:'calc(6px + env(safe-area-inset-bottom))'}}>
                                {[
                                    {id:'home',icon:'home',label:'Défis'},
                                    {id:'friends',icon:'users',label:'Amis'},
                                    {id:'leaderboard',icon:'trophy',label:'Classement'},
                                    {id:'profile',icon:'user',label:'Profil'},
                                ].map(n => (
                                    <button key={n.id} onClick={()=>setTab(n.id)} className={`nav-item ${tab===n.id?'active':''}`} style={{padding:'8px 12px'}}>
                                        <div style={{position:'relative'}}>
                                            <Icon name={n.icon} size={20} className={tab===n.id?'text-orange-500':'text-slate-500'}/>
                                            {n.id==='friends' && friendRequestCount > 0 && (
                                                <span style={{position:'absolute',top:'-6px',right:'-8px',width:'14px',height:'14px',background:'#facc15',borderRadius:'50%',fontSize:'8px',fontWeight:800,color:'#000',display:'flex',alignItems:'center',justifyContent:'center',border:'2px solid #020617'}}>
                                                    {friendRequestCount > 9 ? '9+' : friendRequestCount}
                                                </span>
                                            )}
                                        </div>
                                        <span style={{fontSize:'9px',fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:tab===n.id?'#f97316':'#475569'}}>{n.label}</span>
                                    </button>
                                ))}
                            </nav>

                            {showCreate && <CreateChallengeModal user={user} profile={profile} friends={friends} friendProfiles={friendProfiles} onClose={()=>setShowCreate(false)}/>}
                            {updateTarget && <UpdateProgressModal challenge={updateTarget} user={user} onClose={()=>setUpdateTarget(null)}/>}
                        </>
                    )}
                </div>
            )}
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
